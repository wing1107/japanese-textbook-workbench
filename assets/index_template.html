<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f7f6f2; --card:#ffffff; --ink:#2c2c2a; --mut:#6b6a64; --line:#e2e0d8;
  --blue:#185fa5; --blue-l:#e6f1fb; --teal:#0f6e56; --teal-l:#e1f5ee;
  --amber:#854f0b; --amber-l:#faeeda; --red:#a32d2d; --red-l:#fcebeb;
  --green:#3b6d11; --green-l:#eaf3de;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans GB","Yu Gothic UI","Meiryo","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.7}
.jp{font-family:"Hiragino Mincho ProN","Yu Mincho","MS Mincho",serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:22px 24px 0}
h1{margin:0;font-size:21px;font-weight:500}
.sub{margin:5px 0 0;color:var(--mut);font-size:13px}
nav{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--bg);color:var(--mut);
  padding:8px 16px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px;border-bottom:none}
nav button.on{background:var(--card);color:var(--blue);font-weight:500}
main{max-width:1040px;margin:0 auto;padding:22px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
h2{font-size:16px;font-weight:500;margin:0 0 12px;color:var(--blue)}
h3{font-size:14px;font-weight:500;margin:16px 0 8px}
.grid{display:grid;gap:14px}
.grid2{grid-template-columns:1fr 1fr}
.grid3{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
.stat{display:flex;gap:14px;flex-wrap:wrap}
.stat .box{flex:1;min-width:130px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .box .n{font-size:24px;font-weight:500;color:var(--blue);line-height:1.3}
.stat .box .l{font-size:12px;color:var(--mut)}
.bar{height:9px;background:#eceae3;border-radius:6px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--teal);transition:width .35s;border-radius:6px}
.groupcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card);cursor:pointer;transition:border-color .15s}
.groupcard:hover{border-color:var(--blue)}
.groupcard .gt{font-size:15px;font-weight:500;color:var(--ink);margin-bottom:2px}
.groupcard .gm{font-size:12px;color:var(--mut)}
.groupcard .gp{font-size:12px;color:var(--teal);margin-top:6px}
.lessonrow{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px dashed var(--line)}
.lessonrow:last-child{border-bottom:none}
.lessonrow .lid{font-size:13px;font-weight:500;color:var(--blue);min-width:52px}
.lessonrow .lt{flex:1;font-size:13px}
.lessonrow .lm{font-size:11px;color:var(--mut);white-space:nowrap}
.lessonrow .mini{width:76px}
.lessonrow a{color:var(--teal);font-size:12px;text-decoration:none;white-space:nowrap}
.lessonrow a:hover{text-decoration:underline}
input[type=text]{border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;
  background:var(--card);color:var(--ink);font-family:inherit}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#f1efe8;color:var(--mut);font-weight:500;text-align:left;padding:6px 7px;border:1px solid var(--line);position:sticky;top:0}
td{padding:5px 7px;border:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:#fbfaf7}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;margin-left:8px;vertical-align:2px}
.tag.b{background:var(--blue-l);color:var(--blue)}
.mut{color:var(--mut)} .sm{font-size:12px}
.tblwrap{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.empty{color:var(--mut);font-size:13px;padding:14px 0}
.hint{background:var(--amber-l);border-radius:8px;padding:9px 13px;font-size:12.5px;color:var(--amber);margin:8px 0}
.legend{font-size:12px;color:var(--mut);margin:6px 0 12px}
.chip{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:12px;
  padding:3px 10px;margin:0 6px 6px 0;cursor:pointer;background:var(--card);color:var(--mut)}
.chip.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue)}
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <p class="sub">__SUBTITLE__</p>
  <nav id="tabs"></nav>
</header>
<main id="app"></main>

<script>
__DATA__

/* ---------- 以下为固定渲染逻辑 ---------- */
const CHECKS_N = CFG.checks.length;

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function readKey(k){ try{ return JSON.parse(localStorage.getItem(k)) || {}; }catch(e){ return {}; } }

function progressOf(lesson){
  const s = readKey(lesson.key);
  let done = 0;
  for(let i=0;i<CHECKS_N;i++){ if(s[lesson.id+"_"+i]) done++; }
  return done;
}
function groupProgress(key, ids){
  const s = readKey(key);
  let total = ids.length*CHECKS_N, done = 0;
  ids.forEach(id=>{ for(let i=0;i<CHECKS_N;i++){ if(s[id+"_"+i]) done++; } });
  return {done, total, pct: total? done/total*100 : 0};
}

function homePage(){
  const totalLessons = LESSONS.length;
  let finished = 0, totalItems = 0, doneItems = 0;
  LESSONS.forEach(l=>{
    const d = progressOf(l);
    if(d >= CHECKS_N) finished++;
    totalItems += CHECKS_N; doneItems += d;
  });
  const pct = totalItems ? doneItems/totalItems*100 : 0;
  const totalWords = LESSONS.reduce((a,l)=>a+l.words,0);
  const totalGram = LESSONS.reduce((a,l)=>a+l.gram,0);

  let h = "<div class='card'><h2>全书进度总览</h2>";
  h += "<div class='stat'>";
  h += "<div class='box'><div class='n'>"+finished+" / "+totalLessons+"</div><div class='l'>已复习完的课</div></div>";
  h += "<div class='box'><div class='n'>"+doneItems+" / "+totalItems+"</div><div class='l'>打卡项完成</div></div>";
  h += "<div class='box'><div class='n'>"+totalWords+"</div><div class='l'>收录单词</div></div>";
  h += "<div class='box'><div class='n'>"+totalGram+"</div><div class='l'>语法条目</div></div>";
  h += "<div class='box'><div class='n'>"+ALLVERBS.length+"</div><div class='l'>动词变形</div></div>";
  h += "</div>";
  h += "<div class='bar'><i style='width:"+pct.toFixed(1)+"%'></i></div>";
  h += "<div class='sm mut'>整体完成度 "+pct.toFixed(1)+"%（数据来自各课页面的打卡记录）</div>";
  h += "</div>";

  h += "<div class='card'><h2>课组导航</h2><div class='grid grid2'>";
  GROUPS.forEach(g=>{
    const p = groupProgress(g.key, g.ids);
    h += "<div class='groupcard' data-file='"+esc(g.file)+"'>";
    h += "<div class='gt'>"+esc(g.name)+"</div>";
    h += "<div class='gm'>"+esc(g.note||"")+"</div>";
    h += "<div class='bar' style='margin-top:8px'><i style='width:"+p.pct.toFixed(1)+"%'></i></div>";
    h += "<div class='gp'>"+p.done+" / "+p.total+" 项完成 · 点击进入</div>";
    h += "</div>";
  });
  h += "</div></div>";

  h += "<div class='card'><h2>逐课明细</h2>";
  h += "<div class='legend'>进度条 = 该课「单词/语法/练习」三项打卡完成度。</div>";
  LESSONS.forEach(l=>{
    const d = progressOf(l);
    const pct2 = d/CHECKS_N*100;
    h += "<div class='lessonrow'>";
    h += "<span class='lid'>第"+l.id+"课</span>";
    h += "<span class='lt'>"+esc(l.t)+"</span>";
    h += "<span class='lm'>语法"+l.gram+" · 词"+l.words+"</span>";
    h += "<span class='mini'><span class='bar' style='margin:0'><i style='width:"+pct2+"%'></i></span></span>";
    h += "<span class='lm' style='min-width:44px'>"+d+"/"+CHECKS_N+"</span>";
    h += "<a href='"+encodeURIComponent(l.file)+"'>打开</a>";
    h += "</div>";
  });
  h += "</div>";

  if(CFG.note){
    h += "<div class='card'><h2>说明</h2><div class='hint'>"+esc(CFG.note)+"</div></div>";
  }
  return h;
}

let vFilter = "all";
let vQuery = "";
function verbsPage(){
  let h = "<div class='card'><h2>动词变形大全 <span class='tag b'>"+ALLVERBS.length+" 个动词 · 13 列</span></h2>";
  h += "<div class='legend'>可能形＝能～；意志形＝～吧/打算～；命令形＝（命令）做！；禁止形＝不许～；假设形＝如果～就～；使役形＝让/使某人做～。</div>";
  h += "<div class='filters'>";
  h += "<input type='text' id='vq' placeholder='搜索 ます形 / 辞书形…' value='"+esc(vQuery)+"' style='flex:1;min-width:200px'>";
  h += "<span class='chip "+(vFilter==="all"?"on":"")+"' data-cls='all'>全部</span>";
  h += "<span class='chip "+(vFilter==="動Ⅰ"?"on":"")+"' data-cls='動Ⅰ'>動Ⅰ</span>";
  h += "<span class='chip "+(vFilter==="動Ⅱ"?"on":"")+"' data-cls='動Ⅱ'>動Ⅱ</span>";
  h += "<span class='chip "+(vFilter==="動Ⅲ"?"on":"")+"' data-cls='動Ⅲ'>動Ⅲ</span>";
  h += "<span class='sm mut' id='vcnt'></span>";
  h += "</div>";
  h += "<div class='tblwrap'><table><thead><tr>";
  ["ます形","辞书形","类","て形","た形","ない形","可能形","意志形","命令形","禁止形","假设形","使役形","要点"].forEach(t=>h+="<th>"+t+"</th>");
  h += "</tr></thead><tbody id='vbody'></tbody></table></div></div>";
  return h;
}

function renderVerbRows(){
  const tb = document.getElementById("vbody");
  if(!tb) return;
  const q = vQuery.trim().toLowerCase();
  let n = 0, html = "";
  ALLVERBS.forEach(v=>{
    if(vFilter !== "all" && v[2] !== vFilter) return;
    if(q){
      const hay = (v[0]+" "+v[1]+" "+v[2]).toLowerCase();
      if(hay.indexOf(q) < 0) return;
    }
    n++;
    html += "<tr class='jp'>";
    for(let i=0;i<6;i++) html += "<td>"+esc(v[i])+"</td>";
    for(let i=7;i<13;i++) html += "<td style='background:#f3faf2'>"+esc(v[i])+"</td>";
    html += "<td class='sm'>"+esc(v[6])+"</td></tr>";
  });
  tb.innerHTML = html || "<tr><td colspan='13' class='empty'>没有匹配的动词</td></tr>";
  const c = document.getElementById("vcnt");
  if(c) c.textContent = "命中 "+n+" 个";
}

const TABS = [["home","总览"],["verbs","动词大全"]];
let cur = "home";

function bindVerbs(){
  const app = document.getElementById("app");
  app.innerHTML = verbsPage();
  renderVerbRows();
  const rq = document.getElementById("vq");
  rq.value = vQuery;
  rq.oninput = ()=>{ vQuery = rq.value; renderVerbRows(); };
  app.querySelectorAll(".chip").forEach(ch=>{
    ch.onclick = ()=>{ vFilter = ch.dataset.cls; bindVerbs(); };
  });
}

function render(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = TABS.map(t=>"<button data-t='"+t[0]+"' class='"+(t[0]===cur?"on":"")+"'>"+t[1]+"</button>").join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=b.dataset.t;render();});
  const app = document.getElementById("app");
  if(cur==="home"){
    app.innerHTML = homePage();
    app.querySelectorAll(".groupcard").forEach(c=>{
      c.onclick = ()=>{ location.href = encodeURIComponent(c.dataset.file); };
    });
  }else{
    bindVerbs();
  }
}
render();
</script>
</body>
</html>
